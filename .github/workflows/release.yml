name: Release

# Push a tag `vX.Y.Z` whose version equals [workspace.package] version in
# Cargo.toml. Builds the Windows exe and the macOS universal DMG and publishes
# a GitHub release whose body is the `## vX.Y.Z` section of CHANGELOG.md.
#
# Code signing and notarization run only when ALL of their repository secrets
# exist (docs/SIGNING.md). Without secrets the steps are skipped and the build
# is the same as before: an unsigned Windows exe and an ad-hoc signed macOS app.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check tag against Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG_VERSION cargo=$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # 'true' only when every Azure Trusted Signing secret is configured.
      WINDOWS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_CERT_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p ccoonverter
      # Azure Trusted Signing, now published by Microsoft as "Artifact Signing".
      - name: Sign with Azure Trusted Signing
        if: env.WINDOWS_SIGNING == 'true'
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\target\release\CcooNverter.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Rename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/CcooNverter.exe "dist/CcooNverter_v${VERSION}_windows_x64.exe"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/CcooNverter_v${{ env.VERSION }}_windows_x64.exe
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # 'true' only when every Apple secret is configured.
      MAC_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Add targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build .app and DMG (ad-hoc signed)
        run: bash scripts/build_macos.sh
      - name: Check bundle
        run: |
          file dist/macos/CcooNverter.app/Contents/MacOS/CcooNverter
          codesign --verify --verbose dist/macos/CcooNverter.app

      # Developer ID signing and notarization. Only with all five Apple
      # secrets; see docs/SIGNING.md.
      - name: Import Developer ID certificate
        if: env.MAC_SIGNING == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in APPLE_CERT_P12_BASE64"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        if: env.MAC_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP="dist/macos/CcooNverter.app"
          DMG="dist/macos/CcooNverter_v${VERSION}_macos_universal.dmg"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # The DMG from the build script holds the ad-hoc signed app: rebuild it.
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          rm -f "$DMG"
          hdiutil create -volname "CcooNverter $VERSION" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"
      - name: Remove signing keychain
        if: always() && env.MAC_SIGNING == 'true'
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/CcooNverter_v${{ env.VERSION }}_macos_universal.dmg
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum CcooNverter_v* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "## v" ver " ") == 1 || $0 == "## v" ver) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No '## v$VERSION' section in CHANGELOG.md"
            exit 1
          fi
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          name: CcooNverter v${{ env.VERSION }}
          # Draft first: test the artifacts, then press "Publish release" on GitHub.
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/CcooNverter_v${{ env.VERSION }}_windows_x64.exe
            dist/CcooNverter_v${{ env.VERSION }}_macos_universal.dmg
            dist/SHA256SUMS.txt
            THIRD_PARTY_LICENSES.md
          fail_on_unmatched_files: true
