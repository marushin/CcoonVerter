[workspace]
members = ["crates/core", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/marushin/CcoonVerter"
authors = ["marushin"]

[workspace.dependencies]
ccoonverter-core = { path = "crates/core" }
rawler = "=0.8.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.12.0"
img-parts = "0.4.2"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.2"
ureq = { version = "3.5.1", features = ["json"] }
directories = "6.0.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
fern = "0.7.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Image processing is unbearably slow without optimizations; keep tests usable.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
