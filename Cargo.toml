[workspace]
members = ["crates/core", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/marushin/CcoonVerter"
authors = ["marushin"]

[workspace.dependencies]
ccoonverter-core = { path = "crates/core" }
rawler = "=0.8.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.12.0"
img-parts = "0.4.2"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.2"
ureq = { version = "3.5.1", features = ["json"] }
directories = "6.0.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
fern = "0.7.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"
sha2 = "0.10.9"
# eframe's defaults minus `wgpu` (and the wasm-only `web_screen_reader`):
# the GUI renders with glow (OpenGL) by default; `ccoonverter/wgpu` opts in.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "x11",
    "glow",
] }
# eframe's `winit/default` feature cannot be named from here (no slashes in
# dependency feature lists); a direct dependency with default features
# restores it (x11/wayland back-ends, client-side decorations on Wayland).
winit = "0.30.13"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
rfd = "0.18.0"
open = "5.4.5"
sys-locale = "0.3.2"
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Image processing is unbearably slow without optimizations; keep tests usable.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
