[package]
name = "ccoonverter"
description = "CcooNverter: RAW to JPG batch converter (desktop GUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "CcooNverter"
path = "src/main.rs"

[features]
default = []
# Render with wgpu (DirectX 12 / Vulkan / Metal) instead of the default
# OpenGL (glow) renderer. Adds about 10 MB to the executable.
wgpu = ["eframe/wgpu"]
# Diagnostic only, never part of a shipped build: open the real window, wait
# for the preview, save what the renderer drew to a PNG and exit.
# See src/capture.rs.
capture = []

[dependencies]
ccoonverter-core.workspace = true
eframe.workspace = true
# Only to enable winit's default features (see workspace Cargo.toml).
winit.workspace = true
rfd.workspace = true
open.workspace = true
image.workspace = true
log.workspace = true
sys-locale.workspace = true

[target.'cfg(windows)'.dependencies]
# Dark title bar via DwmSetWindowAttribute (see src/titlebar.rs).
raw-window-handle.workspace = true
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
egui_kittest.workspace = true
# Memory measurement in the ignored thumbnail test only.
sysinfo.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource.workspace = true
